<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morphinia Timing Tool</title>
<style>
  :root {
    --ink: #14100e;
    --shell: #2b2420;
    --shell-light: #3d332c;
    --cream: #f2e9d8;
    --amber: #e8a33d;
    --red: #e0473b;
    --green: #3fae6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--ink);
    color: var(--cream);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    background: var(--shell);
    border-bottom: 1px solid #000;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  header .spacer { flex: 1; }
  button {
    font: inherit;
    background: var(--shell-light);
    color: var(--cream);
    border: 1px solid #0006;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { background: #4a3e34; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--amber); color: #221a0f; font-weight: 600; }
  button.view-tab { background: transparent; border-color: transparent; }
  button.view-tab.active { background: var(--amber); color: #221a0f; font-weight: 600; }
  select {
    font: inherit;
    background: var(--shell-light);
    color: var(--cream);
    border: 1px solid #0006;
    border-radius: 8px;
    padding: 8px 10px;
    max-width: 320px;
  }
  #progress { font-size: 13px; color: #c9bfae; white-space: nowrap; }
  main {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 16px;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }
  #player-col { display: flex; flex-direction: column; gap: 14px; }
  #player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  #player-wrap iframe { width: 100%; height: 100%; border: 0; }
  #empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #8a8072; font-size: 14px; text-align: center; padding: 20px;
  }
  #line-display {
    background: var(--shell);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }
  #line-display .ctx {
    font-size: 14px;
    color: #8a8072;
    margin: 4px 0;
    min-height: 20px;
  }
  #line-display .current {
    font-size: 22px;
    font-weight: 600;
    margin: 10px 0;
    line-height: 1.4;
    min-height: 32px;
  }
  #line-display .current[dir="rtl"] { direction: rtl; }
  #transport {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  #transport .time { font-variant-numeric: tabular-nums; color: var(--amber); min-width: 4ch; }
  #hint {
    text-align: center; font-size: 12px; color: #8a8072;
  }
  #hint kbd {
    background: var(--shell-light); border: 1px solid #0006; border-radius: 4px;
    padding: 1px 6px; font-family: inherit;
  }
  #line-list {
    background: var(--shell);
    border-radius: 10px;
    padding: 8px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .line-row {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .line-row:hover { background: var(--shell-light); }
  .line-row.current { background: var(--amber); color: #221a0f; }
  .line-row .t {
    font-variant-numeric: tabular-nums; color: var(--green); min-width: 4ch; flex-shrink: 0;
  }
  .line-row.current .t { color: #221a0f; font-weight: 700; }
  .line-row .t.empty { color: #6b6355; }
  .line-row .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #drop-zone {
    max-width: 520px; margin: 60px auto; text-align: center;
    border: 2px dashed var(--shell-light); border-radius: 12px; padding: 40px 20px;
  }
  #drop-zone p { color: #c9bfae; }
  #save-flash {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--green); color: #0d1f14; padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  #save-flash.show { opacity: 1; }

  #links-view { max-width: 900px; margin: 0 auto; padding: 16px; }
  #links-toolbar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  }
  #links-filter {
    font: inherit; flex: 1; background: var(--shell-light); color: var(--cream);
    border: 1px solid #0006; border-radius: 8px; padding: 8px 12px;
  }
  #links-summary { font-size: 13px; color: #c9bfae; white-space: nowrap; }
  .link-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--shell); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
  }
  .link-row .badge {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .link-row .badge.missing { background: var(--red); }
  .link-row .badge.present { background: var(--green); }
  .link-row .title { width: 260px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .link-row .title .year { color: #8a8072; font-size: 12px; }
  .link-row input {
    font: inherit; flex: 1; min-width: 0; background: var(--ink); color: var(--cream);
    border: 1px solid #0006; border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  .link-row input.missing { border-color: var(--red); }
  .link-row button { flex-shrink: 0; padding: 6px 12px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Morphinia Timing Tool</h1>
  <button id="view-timer-btn" class="view-tab active">Timer</button>
  <button id="view-links-btn" class="view-tab">Fix Links</button>
  <button id="load-btn">Load a different file</button>
  <input id="file-input" type="file" accept=".csv" style="display:none" />
  <select id="song-select" disabled><option>Loading…</option></select>
  <span class="spacer"></span>
  <span id="progress"></span>
  <button id="export-btn" disabled>Download backup</button>
</header>

<div id="drop-zone" style="display:none">
  <p><strong>Couldn't load data/timing-worksheet.csv from the server.</strong></p>
  <p id="drop-zone-detail">Run the genius: build scripts first, or load a file manually below.</p>
  <p><button id="drop-zone-load-btn">Load a CSV manually</button></p>
</div>

<main id="app" style="display:none">
  <div id="player-col">
    <div id="player-wrap"><div id="empty-state">Pick a song above</div></div>
    <div id="line-display">
      <div class="ctx" id="ctx-prev"></div>
      <div class="current" id="ctx-current">—</div>
      <div class="ctx" id="ctx-next"></div>
    </div>
    <div id="transport">
      <button id="seek-back">« 3s</button>
      <button id="play-pause">Play</button>
      <button id="seek-fwd">3s »</button>
      <span class="time" id="time-display">0:00</span>
    </div>
    <div id="hint">
      <kbd>Space</kbd> mark line &amp; advance &nbsp;·&nbsp;
      <kbd>Backspace</kbd> undo last mark &nbsp;·&nbsp;
      <kbd>←</kbd>/<kbd>→</kbd> seek 3s &nbsp;·&nbsp;
      <kbd>K</kbd> play/pause
    </div>
  </div>
  <div id="line-list"></div>
</main>

<div id="links-view" style="display:none">
  <div id="links-toolbar">
    <input id="links-filter" type="text" placeholder="Filter songs…" />
    <span id="links-summary"></span>
  </div>
  <div id="links-list"></div>
</div>

<div id="save-flash">saved</div>

<script>
// ---------- CSV parse/serialize ----------
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ""; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.length > 1 || r[0] !== "");
}

function csvCell(v) {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCsv(header, rows) {
  return [header, ...rows].map((r) => r.map(csvCell).join(",")).join("\n") + "\n";
}

// ---------- State ----------
const COLS = ["song_title", "album", "year", "youtube_url", "timestamp", "line_text", "line_translation", "line_transliteration"];
let allRows = [];      // array of { song_title, album, ..., timestamp } objects, in original file order
let songs = new Map(); // title -> array of indices into allRows
let currentSong = null;
let currentIdx = 0;    // position within songs.get(currentSong)
let player = null;
let ytReady = false;
let storageKey = null;

function extractVideoId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function looksRtl(text) {
  return /[؀-ۿ]/.test(text);
}

// ---------- Loading ----------
const SERVER_FILE_NAME = "timing-worksheet.csv";
let songSelectWired = false;

function openFilePicker() {
  document.getElementById("file-input").click();
}
document.getElementById("load-btn").addEventListener("click", openFilePicker);
document.getElementById("drop-zone-load-btn").addEventListener("click", openFilePicker);
document.getElementById("file-input").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  loadCsvText(text, file.name);
});

// Loads straight from the server on open — no more picking the file by hand
// every time. Falls back to the manual picker only if that fails (server has
// no worksheet yet, or is unreachable).
async function autoLoadFromServer() {
  try {
    // Relative, not "/api/worksheet" — this page can be served from a
    // subpath (e.g. /lmorphiniya/timestamper/), and an absolute path would
    // resolve against the domain root instead of wherever this page lives.
    const res = await fetch("api/worksheet");
    if (!res.ok) throw new Error(String(res.status));
    loadCsvText(await res.text(), SERVER_FILE_NAME);
  } catch (err) {
    document.getElementById("drop-zone-detail").textContent =
      err.message === "404"
        ? "Run the genius: build scripts first, or load a file manually below."
        : "Couldn't reach the server (" + err.message + ") — load a file manually below, or reload the page.";
    document.getElementById("drop-zone").style.display = "block";
  }
}
autoLoadFromServer();

function countTimed(rows) {
  return rows.filter((r) => r.timestamp).length;
}

function loadCsvText(text, name) {
  const rows = parseCsv(text);
  const header = rows[0];
  allRows = rows.slice(1).map((r) => {
    const obj = {};
    header.forEach((h, i) => (obj[h] = r[i] ?? ""));
    return obj;
  });

  storageKey = "morphinia-timer:" + name + ":" + allRows.length;
  const saved = localStorage.getItem(storageKey);
  if (saved) {
    try {
      const savedRows = JSON.parse(saved);
      // Only offer to resume if the browser copy actually has more done than
      // what just loaded — e.g. the server auto-save missed one. If the
      // server's already caught up (the normal case), don't bother asking.
      if (savedRows.length === allRows.length && countTimed(savedRows) > countTimed(allRows)) {
        if (confirm("This browser has further progress saved than the server copy. Use the browser's version?")) {
          allRows = savedRows;
        }
      }
    } catch {}
  }

  songs = new Map();
  allRows.forEach((row, i) => {
    if (!songs.has(row.song_title)) songs.set(row.song_title, []);
    songs.get(row.song_title).push(i);
  });

  document.getElementById("drop-zone").style.display = "none";
  document.getElementById("app").style.display = "grid";
  document.getElementById("export-btn").disabled = false;

  const select = document.getElementById("song-select");
  select.disabled = false;
  select.innerHTML = "";
  for (const title of songs.keys()) {
    const opt = document.createElement("option");
    opt.value = title;
    select.appendChild(opt);
  }
  if (!songSelectWired) {
    select.addEventListener("change", () => selectSong(select.value));
    songSelectWired = true;
  }

  const firstIncomplete = [...songs.keys()].find((t) => songs.get(t).some((i) => !allRows[i].timestamp));
  selectSong(firstIncomplete ?? songs.keys().next().value);
  updateProgress();
}

// ---------- YouTube ----------
let ytApiPromise = null;
function loadYouTubeApi() {
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve();
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = () => resolve();
    // If this never fires, youtube.com itself is unreachable from this
    // browser (ad-blocker, privacy extension, firewall) — tell the user
    // plainly instead of leaving them staring at a blank box.
    setTimeout(() => reject(new Error("timeout")), 8000);
  });
  return ytApiPromise;
}

const YT_ERROR_MESSAGES = {
  2: "Bad video link in the CSV — check the youtube_url for this song.",
  5: "This browser's HTML5 player couldn't play this video.",
  100: "Video not found (likely removed or made private) — needs a different youtube_url.",
  101: "The uploader disabled embedding for this video — it can only be watched on youtube.com, so it can't be timed here. Needs a different youtube_url (a re-upload, official audio, etc).",
  150: "The uploader disabled embedding for this video — it can only be watched on youtube.com, so it can't be timed here. Needs a different youtube_url (a re-upload, official audio, etc).",
};

// Destroys the current player object before anything wipes its DOM node out
// from under it — without this, the next loadVideoById() reuses a reference
// to an already-removed iframe (that's what threw the console warnings).
function teardownPlayer() {
  if (player) {
    try { player.destroy(); } catch {}
  }
  player = null;
  ytReady = false;
}

function showPlayerStatus(message) {
  teardownPlayer();
  document.getElementById("player-wrap").innerHTML = `<div id="empty-state">${escapeHtml(message)}</div>`;
}

async function ensurePlayer(videoId) {
  try {
    await loadYouTubeApi();
  } catch {
    showPlayerStatus(
      "Couldn't reach youtube.com from this browser. If you have an ad-blocker or privacy extension, try allow-listing this page (or use a different browser) and reload.",
    );
    return;
  }

  if (!player) {
    document.getElementById("player-wrap").innerHTML = '<div id="yt-target" style="width:100%;height:100%"></div>';
    player = new YT.Player("yt-target", {
      videoId,
      playerVars: { playsinline: 1 },
      events: {
        onReady: () => { ytReady = true; },
        // onReady only ever fires once per player object — a later
        // loadVideoById() re-uses it, so onStateChange (fires per video) is
        // the real per-video "safe to call getCurrentTime() now" signal.
        onStateChange: () => { ytReady = true; },
        onError: (e) => {
          showPlayerStatus(YT_ERROR_MESSAGES[e.data] ?? `YouTube error ${e.data} — try a different youtube_url for this song.`);
        },
      },
    });
  } else {
    // Not ready for the new video until its own onStateChange/onError
    // fires — otherwise the interval below can poll a player that's
    // mid-swap, which is exactly what threw the "not attached to DOM"
    // console warnings during testing.
    ytReady = false;
    player.loadVideoById(videoId);
  }
}

// ---------- Song / line rendering ----------
function songTitleFor(indices) {
  const row = allRows[indices[0]];
  const done = indices.filter((i) => allRows[i].timestamp).length;
  return `${row.song_title} (${done}/${indices.length})`;
}

function refreshSongSelectLabels() {
  const select = document.getElementById("song-select");
  [...select.options].forEach((opt) => {
    opt.textContent = songTitleFor(songs.get(opt.value));
  });
}

function selectSong(title) {
  currentSong = title;
  document.getElementById("song-select").value = title;
  const indices = songs.get(title);
  currentIdx = indices.findIndex((i) => !allRows[i].timestamp);
  if (currentIdx === -1) currentIdx = 0;

  const videoId = extractVideoId(allRows[indices[0]].youtube_url);
  if (videoId) {
    ensurePlayer(videoId);
  } else {
    showPlayerStatus("No youtube_url for this song yet — add one to the CSV, or skip it for now.");
  }

  renderAll();
}

function renderAll() {
  refreshSongSelectLabels();
  renderLineList();
  renderCurrentLineDisplay();
  updateProgress();
}

function renderLineList() {
  const list = document.getElementById("line-list");
  list.innerHTML = "";
  const indices = songs.get(currentSong) ?? [];
  indices.forEach((rowIdx, pos) => {
    const row = allRows[rowIdx];
    const div = document.createElement("div");
    div.className = "line-row" + (pos === currentIdx ? " current" : "");
    div.innerHTML =
      `<span class="t ${row.timestamp ? "" : "empty"}">${row.timestamp || "--:--"}</span>` +
      `<span class="txt">${escapeHtml(row.line_text)}</span>`;
    div.addEventListener("click", () => { currentIdx = pos; renderAll(); });
    list.appendChild(div);
  });
  const activeEl = list.children[currentIdx];
  if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderCurrentLineDisplay() {
  const indices = songs.get(currentSong) ?? [];
  const prevText = currentIdx > 0 ? allRows[indices[currentIdx - 1]].line_text : "";
  const curRow = allRows[indices[currentIdx]];
  const nextText = currentIdx < indices.length - 1 ? allRows[indices[currentIdx + 1]].line_text : "";

  document.getElementById("ctx-prev").textContent = prevText;
  document.getElementById("ctx-next").textContent = nextText;
  const cur = document.getElementById("ctx-current");
  cur.textContent = curRow ? curRow.line_text : "(song complete)";
  cur.setAttribute("dir", curRow && looksRtl(curRow.line_text) ? "rtl" : "ltr");
}

function updateProgress() {
  const total = allRows.length;
  const done = allRows.filter((r) => r.timestamp).length;
  document.getElementById("progress").textContent = `${done} / ${total} lines timed`;
}

// ---------- Marking ----------
function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function markCurrentLine() {
  if (!player || !ytReady) return;
  const indices = songs.get(currentSong) ?? [];
  if (currentIdx >= indices.length) return;
  let t;
  try { t = player.getCurrentTime(); } catch { return; }
  allRows[indices[currentIdx]].timestamp = formatTime(t);
  if (currentIdx < indices.length - 1) currentIdx++;
  renderAll();
  saveProgress();
}

function undoLastMark() {
  if (currentIdx === 0) return;
  const indices = songs.get(currentSong) ?? [];
  currentIdx--;
  allRows[indices[currentIdx]].timestamp = "";
  renderAll();
  saveProgress();
}

function serializeCsv() {
  return toCsv(COLS, allRows.map((r) => COLS.map((c) => r[c] ?? "")));
}

function flashSaved(label) {
  const flash = document.getElementById("save-flash");
  flash.textContent = label;
  flash.classList.add("show");
  setTimeout(() => flash.classList.remove("show"), 800);
}

let saveTimer = null;
function saveProgress() {
  if (!storageKey) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    localStorage.setItem(storageKey, JSON.stringify(allRows));

    try {
      const res = await fetch("api/worksheet", { method: "POST", body: serializeCsv() });
      flashSaved(res.ok ? "saved" : "saved to browser only — server rejected the write");
    } catch {
      flashSaved("saved to browser only — server unreachable");
    }
  }, 300);
}

// ---------- Transport ----------
// ytReady-gated and try/caught: the player object can briefly exist but not
// yet be responsive right as a video is swapped in (see teardownPlayer).
function seekBy(deltaSeconds) {
  if (!player || !ytReady) return;
  try { player.seekTo(player.getCurrentTime() + deltaSeconds, true); } catch {}
}

document.getElementById("play-pause").addEventListener("click", () => {
  if (!player || !ytReady) return;
  try {
    if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
  } catch {}
});
document.getElementById("seek-back").addEventListener("click", () => seekBy(-3));
document.getElementById("seek-fwd").addEventListener("click", () => seekBy(3));

setInterval(() => {
  if (!player || !ytReady) return;
  try {
    document.getElementById("time-display").textContent = formatTime(player.getCurrentTime());
    document.getElementById("play-pause").textContent = player.getPlayerState() === 1 ? "Pause" : "Play";
  } catch {}
}, 200);

// ---------- Keyboard ----------
// Checks both `code` and `key` — some input paths (on-screen keyboards,
// certain remote-input/automation setups) only populate one of the two.
function isKey(e, code, key) {
  return e.code === code || e.key === key || e.key?.toLowerCase() === key?.toLowerCase();
}

window.addEventListener("keydown", (e) => {
  const tag = document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (currentView !== "timer") return; // don't hijack Space etc. while fixing links

  if (isKey(e, "Space", " ")) { e.preventDefault(); markCurrentLine(); }
  else if (isKey(e, "Backspace", "Backspace")) { e.preventDefault(); undoLastMark(); }
  else if (isKey(e, "ArrowLeft", "ArrowLeft")) { e.preventDefault(); seekBy(-3); }
  else if (isKey(e, "ArrowRight", "ArrowRight")) { e.preventDefault(); seekBy(3); }
  else if (isKey(e, "KeyK", "k")) { e.preventDefault(); document.getElementById("play-pause").click(); }
});

// ---------- Fix Links view ----------
// Separate from timing: fixes missing or wrong youtube_url per song, since
// not every Genius-sourced link is right (dead videos, embedding disabled,
// or just the wrong upload). Same underlying data + save path as the timer.
let currentView = "timer";

function switchView(view) {
  currentView = view;
  document.getElementById("view-timer-btn").classList.toggle("active", view === "timer");
  document.getElementById("view-links-btn").classList.toggle("active", view === "links");
  document.getElementById("app").style.display = view === "timer" ? "grid" : "none";
  document.getElementById("links-view").style.display = view === "links" ? "block" : "none";
  document.getElementById("song-select").style.display = view === "timer" ? "" : "none";
  if (view === "links") renderLinksPanel();
}
document.getElementById("view-timer-btn").addEventListener("click", () => switchView("timer"));
document.getElementById("view-links-btn").addEventListener("click", () => switchView("links"));
document.getElementById("links-filter").addEventListener("input", renderLinksPanel);

function songYoutubeUrl(indices) {
  return allRows[indices[0]].youtube_url;
}

function countMissingLinks() {
  return [...songs.values()].filter((indices) => !songYoutubeUrl(indices)).length;
}

function updateLinksSummary() {
  document.getElementById("links-summary").textContent = `${countMissingLinks()} of ${songs.size} songs missing a link`;
}

function renderLinksPanel() {
  const filter = document.getElementById("links-filter").value.trim().toLowerCase();
  const list = document.getElementById("links-list");
  list.innerHTML = "";

  const entries = [...songs.entries()]
    .filter(([title]) => title.toLowerCase().includes(filter))
    .sort((a, b) => {
      const aMissing = !songYoutubeUrl(a[1]);
      const bMissing = !songYoutubeUrl(b[1]);
      if (aMissing !== bMissing) return aMissing ? -1 : 1;
      return a[0].localeCompare(b[0]);
    });

  for (const [title, indices] of entries) {
    const url = songYoutubeUrl(indices);
    const year = allRows[indices[0]].year;

    const row = document.createElement("div");
    row.className = "link-row";
    row.innerHTML =
      `<span class="badge ${url ? "present" : "missing"}"></span>` +
      `<span class="title">${escapeHtml(title)}${year ? ` <span class="year">${escapeHtml(year)}</span>` : ""}</span>` +
      `<input type="text" value="${escapeHtml(url)}" placeholder="paste a youtube.com/watch?v=… link" class="${url ? "" : "missing"}" />` +
      `<button type="button">Open ↗</button>`;

    const input = row.querySelector("input");
    const badge = row.querySelector(".badge");

    input.addEventListener("change", () => {
      const newUrl = input.value.trim();
      setSongYoutubeUrl(indices, newUrl);
      input.classList.toggle("missing", !newUrl);
      badge.className = "badge " + (newUrl ? "present" : "missing");
      updateLinksSummary();
      saveProgress();
    });

    row.querySelector("button").addEventListener("click", () => {
      const current = input.value.trim();
      const target = current || `https://www.youtube.com/results?search_query=${encodeURIComponent(title + " L'Morphine")}`;
      window.open(target, "_blank", "noopener");
    });

    list.appendChild(row);
  }

  updateLinksSummary();
}

function setSongYoutubeUrl(indices, url) {
  for (const i of indices) allRows[i].youtube_url = url;
}

// ---------- Manual backup download ----------
// Progress already auto-saves to the server after every mark — this is just
// an extra local copy for peace of mind, not the primary save path anymore.
document.getElementById("export-btn").addEventListener("click", () => {
  const blob = new Blob([serializeCsv()], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "timing-worksheet.csv";
  a.click();
});
</script>
